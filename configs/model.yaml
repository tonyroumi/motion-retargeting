autoencoder:
  encoder:
    block1:
      conv_params:
        in_channels_per_joint: 4
        out_channels_per_joint: 8
        offset_in_channels_per_joint: 3
        bias: true
        kernel_size: 15
        stride: 2
        padding: 7 # = (kernel_size - 1) // 2
        padding_mode: reflect
        dilation: 1
        groups: 1

      pool_features: True

    block2:
      conv_params:
        in_channels_per_joint: 8
        out_channels_per_joint: 16
        offset_in_channels_per_joint: 6
        bias: true
        kernel_size: 15
        padding: 7 # = (kernel_size - 1) // 2
        stride: 2
        padding_mode: reflect
        dilation: 1
        groups: 1

      pool_features: True
      last_pool: True

  decoder:
    block1:
      channels_per_edge: 16

      conv_params:
        in_channels_per_joint: 16
        out_channels_per_joint: 8
        offset_in_channels_per_joint: 6
        bias: true
        kernel_size: 15
        stride: 1
        padding: 7 # = (kernel_size - 1) // 2
        padding_mode: reflect
        dilation: 1
        groups: 1

      activation: true

    block2:
      channels_per_edge: 8

      conv_params:
        in_channels_per_joint: 8
        out_channels_per_joint: 4
        offset_in_channels_per_joint: 3
        bias: true
        kernel_size: 15
        padding: 7 # = (kernel_size - 1) // 2
        stride: 1
        padding_mode: reflect
        dilation: 1
        groups: 1

      activation: false

offset_encoder:
  block1:
    conv_params:
      in_channels_per_joint: 3
      out_channels_per_joint: 6
      bias: true
      kernel_size: 1
      stride: 1
      padding: 0
      padding_mode: constant
      dilation: 1
      groups: 1

    pool_features: True
    last_pool: False

  block2:
    conv_params:
      in_channels_per_joint: 6
      out_channels_per_joint: 12
      bias: true
      kernel_size: 1
      stride: 1
      padding: 0
      padding_mode: constant
      dilation: 1
      groups: 1

    pool_features: False
    last_pool: False

discriminator:
  block1:
    conv_params:
      in_channels_per_joint: 3
      out_channels_per_joint: 6
      bias: false
      kernel_size: 15
      stride: 2
      padding: 7 # = (kernel_size - 1) // 2
      padding_mode: reflect
      dilation: 1
      groups: 1

    norm: true
    activation: true

  block2:
    conv_params:
      in_channels_per_joint: 6
      out_channels_per_joint: 12
      bias: true
      kernel_size: 16
      padding: 0
      stride: 2
      padding_mode: reflect
      dilation: 1
      groups: 1

    norm: false
    activation: false
