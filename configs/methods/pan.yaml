# PAN, running the official code's Mixamo computation on the sources below (see README, "PAN"):
# edge rotations with heading kept, absolute root, all-channel per-bank statistics, masked networks,
# the official objective and generator-then-discriminator updates.
#
# Deviations from the original Mixamo assets:
#   - Skeleton banks: clips with exactly equal offsets stand in for Mixamo characters.
#   - Statistics are fit per bank before the holdout, as the official code does, so the holdout is a
#     reproduction diagnostic and not clean evidence of generalization.
#   - Frames are resampled to target_fps on a timestamp grid, not with Mixamo's literal ::2.
device: cuda

dataset:
  group_a:
    sources:
      - amass
    params:
      sequence_length: 64
      stride: 32
      target_fps: 30
      holdout_percent: 5

  group_b:
    sources:
      - cmu
    params:
      sequence_length: 64
      stride: 32
      target_fps: 30
      holdout_percent: 5

method:
  name: pan

  model:
    motion_encoder:
      embed_dim: 32
      embed_hidden_dim: 512
      num_layers: 2
      num_heads: 2
      feedforward_dim: 256
      dropout: 0.2
      part_token_std: 0.1
      kernel_size: 15
      positional_encoding_basis: 10000
      positional_encoding_max_len: 5000

    motion_decoder:
      kernel_size: 15
      upsample_mode: linear

    motion_discriminator:
      hidden_dim: 256
      kernel_size: 15

  params:
    replay_buffer_size: 50
    swap_probability: 0.5

    # Objective (README, "PAN"): domain and pair aggregations are sums
    reconstruction_lambda: 1
    root_lambda: 100
    position_lambda: 100
    cycle_lambda: 2.5
    adversarial_lambda: 1
    end_effector_lambda: 50
    contact_lambda: 100
    contact_threshold: 0.008

    # Log each loss term's gradient norm every N train steps (0 disables)
    loss_grad_norm_interval: 50

# Published Mixamo command: Adam(0.9, 0.999), no schedule, weight decay or gradient clipping.
trainer:
  batch_size: 128
  learning_rate: 0.001
  num_epochs: 1001

  log_interval: 10
  validation_interval: 25
  checkpoint_interval: 10

  log_dir: logs
  use_tensorboard: true
  verbose: true
