device: cuda

dataset:
  group_a:
    sources:
      - amass
    params:
      sequence_length: 64
      stride: 32
      target_fps: 30
      holdout_percent: 5

  group_b:
    sources:
      - cmu
    params:
      sequence_length: 64
      stride: 32
      target_fps: 30
      holdout_percent: 5

method:
  name: pan

  model:
    motion_encoder:
      embed_dim: 32
      embed_hidden_dim: 512
      num_layers: 2
      num_heads: 2
      feedforward_dim: 256
      dropout: 0.2
      part_token_std: 0.1
      kernel_size: 15
      positional_encoding_basis: 10000
      positional_encoding_max_len: 5000

    motion_decoder:
      kernel_size: 15
      upsample_mode: linear

    motion_discriminator:
      hidden_dim: 256
      kernel_size: 15

  params:
    replay_buffer_size: 50
    swap_probability: 0.5

    reconstruction_lambda: 1
    root_lambda: 100
    position_lambda: 100
    cycle_lambda: 2.5
    adversarial_lambda: 1
    end_effector_lambda: 50
    contact_lambda: 100
    contact_threshold: 0.008

    # Log each loss term's gradient norm every N train steps (0 disables)
    loss_grad_norm_interval: 0

    # Generator global gradient-norm clip (0 disables, as in the official code). Choose it from this
    # config's logged grad/generator, which is far above the 1-10 of the run the clip was diagnosed on.
    generator_max_grad_norm: 0
    # Capture steps whose pre-clip generator gradient norm exceeds this many times its running baseline,
    # keeping the latest few (0 disables)
    grad_spike_factor: 10
    spike_capture_limit: 5
    capture_batch_motion: false

trainer:
  batch_size: 64
  learning_rate: 0.001
  num_epochs: 1001

  log_interval: 10
  validation_interval: 25
  checkpoint_interval: 10

  log_dir: logs
  use_tensorboard: true
  verbose: true
