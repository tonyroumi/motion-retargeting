# Opt-in reference archive semantics, NOT a full training-schedule reproduction.
# Replace directory with a trusted copy of the six reference NPZs.
device: cpu

dataset:
  group_a:
    reference_archive:
      kind: lafan1
      directory: /path/to/Lafan1_and_dog
  group_b:
    reference_archive:
      kind: dog
      directory: /path/to/Lafan1_and_dog

method:
  name: pan
  model:
    motion_encoder:
      embed_dim: 32
      embed_hidden_dim: 512
      num_layers: 1
      num_heads: 1
      feedforward_dim: 256
      dropout: 0.0
      kernel_size: 15
    motion_decoder:
      kernel_size: 15
      upsample_mode: linear
    motion_discriminator:
      hidden_dim: 256
      kernel_size: 15
  params:
    reconstruction_lambda: 1
    root_lambda: 100
    position_lambda: 0.01  # centimetres squared, no height division
    cycle_lambda: 0.001   # MSE position in cm AND MSE latent
    adversarial_lambda: 1
    root_velocity_lambda: 1000  # mapped XYZ + denormalized yaw
    # Replay and legacy end-effector/contact settings are not used on this path.

trainer:
  batch_size: 128
  learning_rate: 0.0001
  num_epochs: 5001
  log_interval: 10
  validation_interval: 25
  checkpoint_interval: 500
  log_dir: logs/lafan_dog_reference
  use_tensorboard: true
  verbose: true
